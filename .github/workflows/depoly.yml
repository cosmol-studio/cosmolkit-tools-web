name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  INDEXNOW_KEY: b2d03e0f-cc00-4050-8e29-3316108be26b

jobs:
  build:
    name: Build (CF) & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1.0.6
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown

      - name: Restore Rust and Dioxus build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: production-wasm-split
          add-job-id-key: false
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true
          cache-directories: |
            ~/.local/share/.dx

      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus-CLI
        run: |
          if ! command -v dx >/dev/null || ! dx --version | grep -q '0.7.10'; then
            cargo binstall -y dioxus-cli@0.7.10
          fi

      - name: Dioxus Build
        run: |
          dx build -r --web --fullstack true --ssg --features "ssg wasm-split" --wasm-split --force-sequential --debug-symbols false
          mkdir -p deploy/web/public
          cp -R target/dx/cosmolkit-tools-web/release/web/public/. deploy/web/public/
          cp robots.txt deploy/web/public/robots.txt
          cp sitemap.xml deploy/web/public/sitemap.xml
          cp _redirects deploy/web/public/_redirects
          cp "${INDEXNOW_KEY}.txt" deploy/web/public/"${INDEXNOW_KEY}.txt"
          python scripts/notify_indexnow.py --dry-run > /dev/null
          python scripts/check_ssg_output.py deploy/web/public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ./deploy

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy/web/public/ --project-name=cosmolkit-tools-web

      - name: Notify IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/notify_indexnow.py
