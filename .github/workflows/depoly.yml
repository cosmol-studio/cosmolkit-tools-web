name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (CF) & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1.0.6
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown

      - uses: cargo-bins/cargo-binstall@main
      - name: Install Dioxus-CLI
        run: |
          cargo binstall -y dioxus-cli@0.7.10

      - uses: Swatinem/rust-cache@v2
      - name: Dioxus Build
        run: |
          dx build -r --web --ssg --features ssg --force-sequential --debug-symbols false
          mkdir -p deploy/web/public
          cp -R target/dx/cosmolkit-tools-web/release/web/public/. deploy/web/public/
          cp robots.txt deploy/web/public/robots.txt
          cp sitemap.xml deploy/web/public/sitemap.xml
          cp _redirects deploy/web/public/_redirects
          python scripts/check_ssg_output.py deploy/web/public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ./deploy

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy/web/public/ --project-name=cosmolkit-tools-web
