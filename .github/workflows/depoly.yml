name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  INDEXNOW_KEY: b2d03e0f-cc00-4050-8e29-3316108be26b
  # Temporary until DioxusLabs/dioxus#5772 is merged and released.
  DIOXUS_CLI_REV: 239f931305d9eb29e7263e6144750a2f7c5141de
  DIOXUS_CLI_ROOT: /home/runner/.cache/dioxus-cli-5772

jobs:
  build:
    name: Build (CF) & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1.0.6
        with:
          profile: minimal
          toolchain: stable
          override: true
          target: wasm32-unknown-unknown

      - name: Restore Rust and Dioxus build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: production-wasm-split-5772-239f9313
          add-job-id-key: false
          cache-targets: true
          cache-bin: true
          cache-all-crates: true
          cache-workspace-crates: true
          cache-on-failure: true
          cache-directories: |
            ~/.local/share/.dx
            ~/.cache/dioxus-cli-5772

      - name: Install patched Dioxus CLI
        run: |
          if [ ! -x "$DIOXUS_CLI_ROOT/bin/dx" ] || \
             [ ! -f "$DIOXUS_CLI_ROOT/.revision" ] || \
             [ "$(cat "$DIOXUS_CLI_ROOT/.revision" 2>/dev/null)" != "$DIOXUS_CLI_REV" ]; then
            rm -rf "$DIOXUS_CLI_ROOT"
            cargo install dioxus-cli \
              --git https://github.com/tdymel/dioxus \
              --rev "$DIOXUS_CLI_REV" \
              --locked \
              --root "$DIOXUS_CLI_ROOT"
            printf '%s\n' "$DIOXUS_CLI_REV" > "$DIOXUS_CLI_ROOT/.revision"
          fi
          "$DIOXUS_CLI_ROOT/bin/dx" --version

      - name: Dioxus Build
        run: |
          rm -rf target/dx/cosmolkit-tools-web/release/web/public deploy/web/public
          "$DIOXUS_CLI_ROOT/bin/dx" build -r --web --fullstack true --ssg --features "ssg wasm-split" --wasm-split --force-sequential --debug-symbols false
          mkdir -p deploy/web/public
          cp -R target/dx/cosmolkit-tools-web/release/web/public/. deploy/web/public/
          cp robots.txt deploy/web/public/robots.txt
          cp sitemap.xml deploy/web/public/sitemap.xml
          cp _redirects deploy/web/public/_redirects
          cp "${INDEXNOW_KEY}.txt" deploy/web/public/"${INDEXNOW_KEY}.txt"
          python scripts/notify_indexnow.py --dry-run > /dev/null
          python scripts/check_ssg_output.py deploy/web/public

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: ./deploy

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./deploy/web/public/ --project-name=cosmolkit-tools-web

      - name: Notify IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/notify_indexnow.py
