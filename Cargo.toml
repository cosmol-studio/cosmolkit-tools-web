[package]
name = "cosmolkit-tools-web"
version = "0.1.0"
authors = ["950288 <950288s@gmail.com>"]
edition = "2024"
build = "build.rs"

[dependencies]
# cosmol_viewer_core = { path = "../cosmol_viewer/crates/core" }
# cosmolkit = { path = "../cosmolkit/crates/cosmolkit" }
cosmol_viewer_core = "0.2.21"
dioxus = { version = "0.7.9", features = ["router"] }
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
wasm-bindgen = "0.2.122"
wasm-bindgen-futures = "0.4.72"
web-sys = "0.3.99"

[build-dependencies]
cosmol_viewer_core = "0.2.21"
cosmolkit = "0.2.7"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
